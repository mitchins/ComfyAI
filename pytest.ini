[pytest]
minversion = 7.0
addopts = -q
testpaths = tests integration_tests
markers =
    onnx: mark tests requiring onnxruntime or FastAPI
    integration: mark integration tests
    slow: mark tests that take several minutes to run (model downloads)
    screenshot: mark tests for screenshot generation
    server_required: mark tests that require server to be running

# Playwright configuration for screenshot tests
# Screenshots saved to screenshots/ directory
# Use --headed to run with visible browser
# Use --browser=firefox to test with Firefox instead of Chromium
