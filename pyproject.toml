[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyai"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["nodes*", "apps*", "comfyai*", "common*"]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.15",
    "fastapi>=0.95",
    "uvicorn>=0.22",
]
# torch = ["torch>=2.0"]

[project.dev-dependencies]
pytest = "^7.0"
pillow = "^9.0"
numpy = "^1.23"
requests = "^2.28"

[project.scripts]
comfyai-onnx-server = "apps.onnx_chat.main:main"
